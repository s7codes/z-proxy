[package]
name = "chaosproxy"
version = "0.1.0"
description = "Local API resilience, fault injection and telemetry suite"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# Distinct lib name avoids the bin/lib name collision on Windows (cargo#8519).
name = "chaosproxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: fuzz cases keep the operator's field order, so a mutated payload reads like
# the base payload it came from and order-sensitive parsers see the original layout.
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.54", features = ["sync", "time", "macros", "net", "rt"] }
# No TLS backend: every outbound connection is loopback-only, and rustls/aws-lc-rs
# would add a NASM/CMake toolchain requirement on Windows for no benefit.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
axum = "0.8"
# The proxy drives hyper connections directly instead of `axum::serve` so a fault can abort
# one TCP connection with RST; axum still provides routing and request extraction.
hyper = { version = "1.8", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.19", features = ["tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
# Seedable PRNG without OS entropy plumbing; fault decisions are reproducible in tests.
fastrand = "2.3"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
# Same WHATWG parser reqwest uses internally; needed directly for `url::Host` matching.
url = "2.5"
regex = "1.13"
walkdir = "2.5"
# Event-level parser: OpenAPI routes are reported with the line of their `paths` key, which
# serde-based YAML crates discard. Encoding detection is not needed for UTF-8 specs.
yaml-rust2 = { version = "0.13", default-features = false }
# Invoked from Rust only (pick_project_root); the webview is granted no dialog permission.
tauri-plugin-dialog = "2.8"

[dev-dependencies]
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "net", "macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
